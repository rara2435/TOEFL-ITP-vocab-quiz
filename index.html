<script>
const QUESTION_BANK = [
  {
    id: 1, category: "動詞", answer: "require",
    before: "All living organisms", after: "water and essential nutrients to survive.",
    choices: ["require", "provide", "decline", "hesitate"],
    translation: "すべての生物は、生き残るために水と不可欠な栄養素を必要とする。"
  },
  {
    id: 2, category: "形容詞", answer: "significant",
    before: "Sunlight plays a", after: "role in the process of photosynthesis.",
    choices: ["significant", "reluctant", "temporary", "fragile"],
    translation: "太陽光は光合成の過程において重要な役割を果たしている。"
  },
  {
    id: 3, category: "動詞", answer: "maintain",
    before: "Warm-blooded animals can", after: "a constant body temperature even in cold weather.",
    choices: ["maintain", "abandon", "interrupt", "consume"],
    translation: "恒温動物は寒い天候の中でも一定の体温を維持することができる。"
  },
  {
    id: 4, category: "名詞", answer: "evidence",
    before: "Scientists found clear", after: "of ancient water on the surface of Mars.",
    choices: ["evidence", "interval", "obstacle", "attitude"],
    translation: "科学者たちは火星の表面に古代の水の明確な証拠を発見した。"
  },
  {
    id: 5, category: "副詞", answer: "currently",
    before: "The software update is", after: "unavailable due to server maintenance.",
    choices: ["currently", "barely", "formerly", "mutually"],
    translation: "サーバーメンテナンスのため、現在ソフトウェアのアップデートは利用できません。"
  }
];

let currentIndex = 0;
let score = 0;
let isAnswered = false;

// DOM要素の取得
const els = {
  quizView: document.getElementById('quizView'),
  resultView: document.getElementById('resultView'),
  questionText: document.getElementById('questionText'),
  speakerBtn: document.getElementById('questionSpeakerBtn'),
  optionsList: document.getElementById('optionsList'),
  nextBtn: document.getElementById('nextBtn'),
  hintCardContent: document.getElementById('hintCardContent'),
  blurOverlay: document.getElementById('blurOverlay'),
  progressSegments: document.getElementById('progressSegments'),
  headerCount: document.getElementById('headerCount'),
  scoreValue: document.getElementById('scoreValue'),
  newSetBtn: document.getElementById('newSetBtn')
};

// 音声再生機能（iOS/Android/PC対応）
function speakText(text, buttonEl) {
  if (!window.speechSynthesis) {
    alert("お使いのブラウザは音声読み上げに対応していません。");
    return;
  }
  window.speechSynthesis.cancel(); // 連続再生時の重複を防ぐ
  const utterance = new SpeechSynthesisUtterance(text);
  utterance.lang = 'en-US';
  utterance.rate = 0.9;
  
  if (buttonEl) buttonEl.classList.add('speaking');
  utterance.onend = () => {
    if (buttonEl) buttonEl.classList.remove('speaking');
  };
  
  window.speechSynthesis.speak(utterance);
}

function initQuiz() {
  currentIndex = 0;
  score = 0;
  els.quizView.classList.remove('screen-hidden');
  els.resultView.classList.add('screen-hidden');
  renderProgress();
  loadQuestion();
}

function renderProgress() {
  els.progressSegments.innerHTML = '';
  for (let i = 0; i < QUESTION_BANK.length; i++) {
    const seg = document.createElement('div');
    seg.className = 'progress-seg';
    if (i < currentIndex) seg.classList.add('active'); // 完了した問題
    els.progressSegments.appendChild(seg);
  }
}

function loadQuestion() {
  isAnswered = false;
  const q = QUESTION_BANK[currentIndex];
  els.headerCount.textContent = `${currentIndex + 1} / ${QUESTION_BANK.length}`;
  
  // 問題文の表示（空欄を作成）
  els.questionText.innerHTML = `${q.before} <span class="blank-slot">____</span> ${q.after}`;
  
  // 選択肢の表示
  els.optionsList.innerHTML = '';
  const letters = ['A', 'B', 'C', 'D'];
  q.choices.forEach((choice, index) => {
    const btn = document.createElement('button');
    btn.className = 'option-btn';
    btn.innerHTML = `
      <div class="option-left">
        <span class="option-letter">${letters[index]}</span>
        <span class="option-word">${choice}</span>
      </div>
    `;
    btn.onclick = () => handleSelect(choice, btn, letters[index]);
    els.optionsList.appendChild(btn);
  });

  // ヒントエリアをリセット
  els.blurOverlay.classList.remove('screen-hidden');
  els.hintCardContent.innerHTML = '';
  
  // ボタンリセット
  els.nextBtn.disabled = true;
  els.nextBtn.textContent = '選択肢を選んでください';
  els.nextBtn.classList.remove('ready');
  
  // プログレスバーの現在位置をハイライト
  els.progressSegments.children[currentIndex].style.backgroundColor = '#A8C7FA';
}

function handleSelect(selectedChoice, btnEl, letter) {
  if (isAnswered) return;
  isAnswered = true;
  
  const q = QUESTION_BANK[currentIndex];
  const isCorrect = (selectedChoice === q.answer);
  
  if (isCorrect) score++;

  // 選択肢の正誤ハイライト
  Array.from(els.optionsList.children).forEach(child => {
    child.classList.add('locked');
    const word = child.querySelector('.option-word').textContent;
    if (word === q.answer) {
      child.classList.add('correct'); // 正解の選択肢を緑に
    } else if (word === selectedChoice && !isCorrect) {
      child.classList.add('wrong'); // 間違えて選んだものを赤に
    }
  });

  // 空欄に正解を埋める
  els.questionText.innerHTML = `${q.before} <span class="blank-slot filled">${q.answer}</span> ${q.after}`;
  
  // ヒント・解説の表示
  els.blurOverlay.classList.add('screen-hidden');
  els.hintCardContent.innerHTML = `
    <div class="exp-header">
      <span class="exp-badge">日本語訳</span>
    </div>
    <div class="exp-translation">${q.translation}</div>
  `;

  // 次へボタンの活性化
  els.nextBtn.disabled = false;
  els.nextBtn.textContent = currentIndex === QUESTION_BANK.length - 1 ? '結果を見る' : '次の問題へ';
  els.nextBtn.classList.add('ready');

  // 自動で問題文全体を読み上げる
  const fullText = `${q.before} ${q.answer} ${q.after}`;
  speakText(fullText, els.speakerBtn);
}

// イベントリスナー
els.speakerBtn.addEventListener('click', () => {
  const q = QUESTION_BANK[currentIndex];
  // 解答前は "blank" と読み、解答後は正解を読んでくれる
  const wordToSpeak = isAnswered ? q.answer : "blank";
  const fullText = `${q.before} ${wordToSpeak} ${q.after}`;
  speakText(fullText, els.speakerBtn);
});

els.blurOverlay.addEventListener('click', () => {
  if (isAnswered) return;
  els.blurOverlay.classList.add('screen-hidden');
  els.hintCardContent.innerHTML = `<div class="exp-translation" style="color:#A8C7FA;">※まずは空欄に入る品詞や文脈を推測してみましょう</div>`;
});

els.nextBtn.addEventListener('click', () => {
  if (!isAnswered) return;
  
  if (currentIndex < QUESTION_BANK.length - 1) {
    currentIndex++;
    loadQuestion();
  } else {
    showResult();
  }
});

els.newSetBtn.addEventListener('click', initQuiz);

function showResult() {
  els.quizView.classList.add('screen-hidden');
  els.resultView.classList.remove('screen-hidden');
  els.scoreValue.innerHTML = `${score} <span>/ ${QUESTION_BANK.length} 問正解</span>`;
}

// アプリ起動
window.onload = initQuiz;
</script>
</body>
</html>
