<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>TOEFL ITP 基礎単語クイズ</title>
<style>
  :root {
    --bg-main: #131314;
    --bg-card: #1E1F20;
    --bg-card-alt: #282A2C;
    --text-main: #E3E3E3;
    --text-sub: #9AA0A6;
    --accent: #A8C7FA;
    --accent-dim: rgba(168, 199, 250, 0.14);
    --bar-inactive: #2C2E33;
    --border-subtle: #2C2E33;

    /* 3色ヒントコンテナ（確定版配色・高コントラスト） */
    --hint-struct-bg: #192231;
    --hint-struct-border: #25344D;
    --hint-struct-pill-bg: #263854;
    --hint-struct-pill-text: #A8C7FA;

    --hint-vocab-bg: #17241E;
    --hint-vocab-border: #243D32;
    --hint-vocab-pill-bg: #223D30;
    --hint-vocab-pill-text: #81C995;
    --hint-vocab-chip-bg: #20352B;
    --hint-vocab-chip-border: #315243;
    --hint-vocab-chip-sub: #B7DEC3;

    --hint-gram-bg: #262116;
    --hint-gram-border: #3B321F;
    --hint-gram-pill-bg: #42361E;
    --hint-gram-pill-text: #FDD663;

    /* 正誤カラー */
    --correct-bg: #182921;
    --correct-border: #81C995;
    --correct-text: #81C995;
    --wrong-bg: #2B1A1A;
    --wrong-border: #F28B82;
    --wrong-text: #F28B82;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
    box-shadow: none !important;
    text-shadow: none !important;
  }

  html, body {
    width: 100%;
    height: 100%;
    background-color: var(--bg-main);
    color: var(--text-main);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Sans", "Noto Sans JP", sans-serif;
    overflow: hidden;
  }

  .app-shell {
    width: 100%;
    max-width: 480px;
    height: 100dvh;
    max-height: 100dvh;
    margin: 0 auto;
    padding: 62px 18px 16px;
    display: flex;
    flex-direction: column;
    background-color: var(--bg-main);
    overflow: hidden;
  }

  /* ヘッダー＆インスタグラムストーリー風5分割プログレスバー */
  .top-header {
    width: 100%;
    flex-shrink: 0;
  }

  .header-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }

  .header-title-wrap {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .header-title {
    font-size: 14px;
    font-weight: 600;
    color: var(--text-main);
    letter-spacing: 0.02em;
  }

  .mode-badge {
    font-size: 11px;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: 999px;
    background-color: var(--hint-gram-pill-bg);
    color: var(--hint-gram-pill-text);
  }

  .header-count {
    font-size: 13px;
    font-weight: 600;
    color: var(--text-sub);
    font-variant-numeric: tabular-nums;
  }

  .progress-segments {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 5px;
    width: 100%;
  }

  .progress-seg {
    height: 4px;
    border-radius: 2px;
    background-color: var(--bar-inactive);
    transition: background-color 0.2s ease;
  }

  .progress-seg.active {
    background-color: var(--accent);
  }

  .progress-seg.wrong {
    background-color: var(--wrong-border);
  }

  /* クイズメインコンテナ */
  #quizView {
    display: flex;
    flex-direction: column;
    flex: 1;
    min-height: 0;
    justify-content: flex-start;
  }

  /* 問題文エリア */
  .question-section {
    margin-top: 22px;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
    flex-shrink: 0;
  }

  .question-text {
    font-size: 21px;
    line-height: 1.48;
    font-weight: 500;
    color: var(--text-main);
    flex: 1;
    word-break: break-word;
  }

  .blank-slot {
    display: inline-block;
    min-width: 78px;
    border-bottom: 2px solid var(--accent);
    color: var(--accent);
    text-align: center;
    padding: 0 4px;
    font-weight: 600;
    line-height: 1.28;
  }

  .blank-slot.filled {
    border-bottom-color: var(--correct-border);
    color: var(--correct-text);
  }

  .speaker-btn {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    border: 1px solid var(--border-subtle);
    background-color: var(--bg-card);
    color: var(--text-main);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
    transition: border-color 0.15s ease, color 0.15s ease, background-color 0.15s ease;
  }

  .speaker-btn:active {
    background-color: var(--bg-card-alt);
  }

  .speaker-btn.speaking {
    border-color: var(--accent);
    color: var(--accent);
    background-color: var(--accent-dim);
  }

  /* 3段ヒント＆解説カード */
  .hint-card {
    margin-top: 20px;
    background-color: var(--bg-card);
    border: 1px solid var(--border-subtle);
    border-radius: 14px;
    padding: 9px 10px;
    flex: 1 1 auto;
    min-height: 195px;
    max-height: 242px;
    overflow-y: auto;
    position: relative;
    scrollbar-width: thin;
    scrollbar-color: #3C4043 transparent;
  }

  .hint-card::-webkit-scrollbar {
    width: 4px;
  }

  .hint-card::-webkit-scrollbar-thumb {
    background-color: #3C4043;
    border-radius: 4px;
  }

  .hint-card.interactive {
    cursor: pointer;
  }

  .hint-stack {
    display: flex;
    flex-direction: column;
    gap: 5px;
  }

  .hint-box {
    border-radius: 9px;
    padding: 6px 9px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .hint-box.struct {
    background-color: var(--hint-struct-bg);
    border: 1px solid var(--hint-struct-border);
  }

  .hint-box.vocab {
    background-color: var(--hint-vocab-bg);
    border: 1px solid var(--hint-vocab-border);
  }

  .hint-box.gram {
    background-color: var(--hint-gram-bg);
    border: 1px solid var(--hint-gram-border);
  }

  .hint-box-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .hint-pill {
    display: inline-block;
    font-size: 10.5px;
    font-weight: 700;
    padding: 1.5px 8px;
    border-radius: 999px;
    letter-spacing: 0.03em;
  }

  .hint-box.struct .hint-pill {
    background-color: var(--hint-struct-pill-bg);
    color: var(--hint-struct-pill-text);
  }

  .hint-box.vocab .hint-pill {
    background-color: var(--hint-vocab-pill-bg);
    color: var(--hint-vocab-pill-text);
  }

  .hint-box.gram .hint-pill {
    background-color: var(--hint-gram-pill-bg);
    color: var(--hint-gram-pill-text);
  }

  .hint-body-text {
    font-size: 12px;
    line-height: 1.44;
    color: var(--text-main);
  }

  /* 単語チップ */
  .chip-list {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
  }

  .word-chip {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 11.5px;
    line-height: 1.28;
    padding: 3px 7px;
    border-radius: 7px;
    background-color: var(--hint-vocab-chip-bg);
    border: 1px solid var(--hint-vocab-chip-border);
    color: var(--text-main);
  }

  .word-chip strong {
    font-weight: 700;
    color: #FFFFFF;
  }

  .word-chip span {
    color: var(--hint-vocab-chip-sub);
    font-weight: 500;
  }

  /* 解説ビュー */
  .exp-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 6px;
  }

  .exp-badge {
    font-size: 10.5px;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 999px;
    background-color: var(--accent-dim);
    color: var(--accent);
  }

  .toggle-indicator {
    font-size: 11px;
    color: var(--accent);
    font-weight: 500;
  }

  .exp-translation {
    font-size: 13px;
    line-height: 1.45;
    color: var(--text-main);
    margin-bottom: 7px;
    padding-bottom: 7px;
    border-bottom: 1px solid var(--border-subtle);
  }

  .exp-choices-grid {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .exp-choice-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 12px;
    padding: 3.5px 8px;
    border-radius: 7px;
    background-color: var(--bg-card-alt);
  }

  .exp-choice-item.is-correct {
    background-color: var(--correct-bg);
    border: 1px solid var(--hint-vocab-border);
  }

  .exp-choice-word {
    font-weight: 600;
    color: var(--text-main);
  }

  .exp-choice-item.is-correct .exp-choice-word {
    color: var(--correct-text);
  }

  .exp-choice-meaning {
    color: var(--text-sub);
  }

  /* 復習モード専用ぼかしオーバーレイ */
  .blur-overlay {
    position: absolute;
    inset: 0;
    background-color: rgba(30, 31, 32, 0.88);
    backdrop-filter: blur(7px);
    -webkit-backdrop-filter: blur(7px);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
    border-radius: 13px;
    cursor: pointer;
    z-index: 5;
  }

  .blur-overlay-label {
    font-size: 13px;
    font-weight: 600;
    color: var(--accent);
    padding: 6px 14px;
    border-radius: 999px;
    background-color: var(--accent-dim);
    border: 1px solid rgba(168, 199, 250, 0.3);
  }

  .blur-overlay-sub {
    font-size: 11px;
    color: var(--text-sub);
  }

  /* 4択リスト */
  .options-list {
    margin-top: 20px;
    display: flex
