<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>TOEFL ITP 基礎単語クイズ</title>
<style>
  :root {
    --bg-main: #131314;
    --bg-card: #1E1F20;
    --bg-card-alt: #282A2C;
    --text-main: #E3E3E3;
    --text-sub: #9AA0A6;
    --accent: #A8C7FA;
    --accent-dim: rgba(168, 199, 250, 0.14);
    --bar-inactive: #2C2E33;
    --border-subtle: #2C2E33;

    --hint-struct-bg: #192231;
    --hint-struct-border: #25344D;
    --hint-struct-pill-bg: #263854;
    --hint-struct-pill-text: #A8C7FA;

    --hint-vocab-bg: #17241E;
    --hint-vocab-border: #243D32;
    --hint-vocab-pill-bg: #223D30;
    --hint-vocab-pill-text: #81C995;
    --hint-vocab-chip-bg: #20352B;
    --hint-vocab-chip-border: #315243;
    --hint-vocab-chip-sub: #B7DEC3;

    --hint-gram-bg: #262116;
    --hint-gram-border: #3B321F;
    --hint-gram-pill-bg: #42361E;
    --hint-gram-pill-text: #FDD663;

    --correct-bg: #182921;
    --correct-border: #81C995;
    --correct-text: #81C995;
    --wrong-bg: #2B1A1A;
    --wrong-border: #F28B82;
    --wrong-text: #F28B82;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
    box-shadow: none !important;
    text-shadow: none !important;
  }

  html, body {
    width: 100%;
    height: 100%;
    background-color: var(--bg-main);
    color: var(--text-main);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Sans", "Noto Sans JP", sans-serif;
    overflow: hidden;
  }

  .app-shell {
    width: 100%;
    max-width: 480px;
    height: 100dvh;
    max-height: 100dvh;
    margin: 0 auto;
    padding: 62px 18px 16px;
    display: flex;
    flex-direction: column;
    background-color: var(--bg-main);
    overflow: hidden;
    position: relative;
  }

  .audio-toast {
    position: fixed;
    top: 16px;
    left: 50%;
    transform: translateX(-50%);
    background-color: var(--bg-card-alt);
    border: 1px solid var(--accent);
    color: var(--text-main);
    font-size: 12px;
    padding: 7px 14px;
    border-radius: 999px;
    z-index: 100;
    white-space: nowrap;
    pointer-events: none;
  }

  .top-header {
    width: 100%;
    flex-shrink: 0;
  }

  .header-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }

  .header-title-wrap {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .header-title {
    font-size: 14px;
    font-weight: 600;
    color: var(--text-main);
    letter-spacing: 0.02em;
  }

  .mode-badge {
    font-size: 11px;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: 999px;
    background-color: var(--hint-gram-pill-bg);
    color: var(--hint-gram-pill-text);
  }

  .header-count {
    font-size: 13px;
    font-weight: 600;
    color: var(--text-sub);
    font-variant-numeric: tabular-nums;
  }

  .progress-segments {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 5px;
    width: 100%;
  }

  .progress-seg {
    height: 4px;
    border-radius: 2px;
    background-color: var(--bar-inactive);
    transition: background-color 0.2s ease;
  }

  .progress-seg.active {
    background-color: var(--accent);
  }
