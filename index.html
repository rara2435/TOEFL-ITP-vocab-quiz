<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>TOEFL ITP 基礎単語クイズ</title>
<style>
  :root {
    --bg-main: #131314;
    --bg-card: #1E1F20;
    --bg-card-alt: #282A2C;
    --text-main: #E3E3E3;
    --text-sub: #9AA0A6;
    --accent: #A8C7FA;
    --accent-dim: rgba(168, 199, 250, 0.14);
    --bar-inactive: #2C2E33;
    --border-subtle: #2C2E33;

    /* 3色ヒントコンテナ（確定版配色・高コントラスト） */
    --hint-struct-bg: #192231;
    --hint-struct-border: #25344D;
    --hint-struct-pill-bg: #263854;
    --hint-struct-pill-text: #A8C7FA;

    --hint-vocab-bg: #17241E;
    --hint-vocab-border: #243D32;
    --hint-vocab-pill-bg: #223D30;
    --hint-vocab-pill-text: #81C995;
    --hint-vocab-chip-bg: #20352B;
    --hint-vocab-chip-border: #315243;
    --hint-vocab-chip-sub: #B7DEC3;

    --hint-gram-bg: #262116;
    --hint-gram-border: #3B321F;
    --hint-gram-pill-bg: #42361E;
    --hint-gram-pill-text: #FDD663;

    /* 正誤カラー */
    --correct-bg: #182921;
    --correct-border: #81C995;
    --correct-text: #81C995;
    --wrong-bg: #2B1A1A;
    --wrong-border: #F28B82;
    --wrong-text: #F28B82;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
    box-shadow: none !important;
    text-shadow: none !important;
  }

  html, body {
    width: 100%;
    height: 100%;
    background-color: var(--bg-main);
    color: var(--text-main);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Sans", "Noto Sans JP", sans-serif;
    overflow: hidden;
  }

  .app-shell {
    width: 100%;
    max-width: 480px;
    height: 100dvh;
    max-height: 100dvh;
    margin: 0 auto;
    padding: 62px 18px 16px;
    display: flex;
    flex-direction: column;
    background-color: var(--bg-main);
    overflow: hidden;
  }

  /* ヘッダー＆インスタグラムストーリー風5分割プログレスバー */
  .top-header {
    width: 100%;
    flex-shrink: 0;
  }

  .header-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }

  .header-title-wrap {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .header-title {
    font-size: 14px;
    font-weight: 600;
    color: var(--text-main);
    letter-spacing: 0.02em;
  }

  .mode-badge {
    font-size: 11px;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: 999px;
    background-color: var(--hint-gram-pill-bg);
    color: var(--hint-gram-pill-text);
  }

  .header-count {
    font-size: 13px;
    font-weight: 600;
    color: var(--text-sub);
    font-variant-numeric: tabular-nums;
  }

  .progress-segments {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 5px;
    width: 100%;
  }

  .progress-seg {
    height: 4px;
    border-radius: 2px;
    background-color: var(--bar-inactive);
    transition: background-color 0.2s ease;
  }

  .progress-seg.active {
    background-color: var(--accent);
  }

  .progress-seg.wrong {
    background-color: var(--wrong-border);
  }

  /* クイズメインコンテナ */
  #quizView {
    display: flex;
    flex-direction: column;
    flex: 1;
    min-height: 0;
    justify-content: flex-start;
  }

  /* 問題文エリア */
  .question-section {
    margin-top: 22px;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
    flex-shrink: 0;
  }

  .question-text {
    font-size: 21px;
    line-height: 1.48;
    font-weight: 500;
    color: var(--text-main);
    flex: 1;
    word-break: break-word;
  }

  .blank-slot {
    display: inline-block;
    min-width: 78px;
    border-bottom: 2px solid var(--accent);
    color: var(--accent);
    text-align: center;
    padding: 0 4px;
    font-weight: 600;
    line-height: 1.28;
  }

  .blank-slot.filled {
    border-bottom-color: var(--correct-border);
    color: var(--correct-text);
  }

  .speaker-btn {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    border: 1px solid var(--border-subtle);
    background-color: var(--bg-card);
    color: var(--text-main);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
    transition: border-color 0.15s ease, color 0.15s ease, background-color 0.15s ease;
  }

  .speaker-btn:active {
    background-color: var(--bg-card-alt);
  }

  .speaker-btn.speaking {
    border-color: var(--accent);
    color: var(--accent);
    background-color: var(--accent-dim);
  }

  /* 3段ヒント＆解説カード */
  .hint-card {
    margin-top: 20px;
    background-color: var(--bg-card);
    border: 1px solid var(--border-subtle);
    border-radius: 14px;
    padding: 9px 10px;
    flex: 1 1 auto;
    min-height: 195px;
    max-height: 242px;
    overflow-y: auto;
    position: relative;
    scrollbar-width: thin;
    scrollbar-color: #3C4043 transparent;
  }

  .hint-card::-webkit-scrollbar {
    width: 4px;
  }

  .hint-card::-webkit-scrollbar-thumb {
    background-color: #3C4043;
    border-radius: 4px;
  }

  .hint-card.interactive {
    cursor: pointer;
  }

  .hint-stack {
    display: flex;
    flex-direction: column;
    gap: 5px;
  }

  .hint-box {
    border-radius: 9px;
    padding: 6px 9px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .hint-box.struct {
    background-color: var(--hint-struct-bg);
    border: 1px solid var(--hint-struct-border);
  }

  .hint-box.vocab {
    background-color: var(--hint-vocab-bg);
    border: 1px solid var(--hint-vocab-border);
  }

  .hint-box.gram {
    background-color: var(--hint-gram-bg);
    border: 1px solid var(--hint-gram-border);
  }

  .hint-box-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .hint-pill {
    display: inline-block;
    font-size: 10.5px;
    font-weight: 700;
    padding: 1.5px 8px;
    border-radius: 999px;
    letter-spacing: 0.03em;
  }

  .hint-box.struct .hint-pill {
    background-color: var(--hint-struct-pill-bg);
    color: var(--hint-struct-pill-text);
  }

  .hint-box.vocab .hint-pill {
    background-color: var(--hint-vocab-pill-bg);
    color: var(--hint-vocab-pill-text);
  }

  .hint-box.gram .hint-pill {
    background-color: var(--hint-gram-pill-bg);
    color: var(--hint-gram-pill-text);
  }

  .hint-body-text {
    font-size: 12px;
    line-height: 1.44;
    color: var(--text-main);
  }

  /* 単語チップ */
  .chip-list {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
  }

  .word-chip {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 11.5px;
    line-height: 1.28;
    padding: 3px 7px;
    border-radius: 7px;
    background-color: var(--hint-vocab-chip-bg);
    border: 1px solid var(--hint-vocab-chip-border);
    color: var(--text-main);
  }

  .word-chip strong {
    font-weight: 700;
    color: #FFFFFF;
  }

  .word-chip span {
    color: var(--hint-vocab-chip-sub);
    font-weight: 500;
  }

  /* 解説ビュー */
  .exp-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 6px;
  }

  .exp-badge {
    font-size: 10.5px;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 999px;
    background-color: var(--accent-dim);
    color: var(--accent);
  }

  .toggle-indicator {
    font-size: 11px;
    color: var(--accent);
    font-weight: 500;
  }

  .exp-translation {
    font-size: 13px;
    line-height: 1.45;
    color: var(--text-main);
    margin-bottom: 7px;
    padding-bottom: 7px;
    border-bottom: 1px solid var(--border-subtle);
  }

  .exp-choices-grid {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .exp-choice-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 12px;
    padding: 3.5px 8px;
    border-radius: 7px;
    background-color: var(--bg-card-alt);
  }

  .exp-choice-item.is-correct {
    background-color: var(--correct-bg);
    border: 1px solid var(--hint-vocab-border);
  }

  .exp-choice-word {
    font-weight: 600;
    color: var(--text-main);
  }

  .exp-choice-item.is-correct .exp-choice-word {
    color: var(--correct-text);
  }

  .exp-choice-meaning {
    color: var(--text-sub);
  }

  /* 復習モード専用ぼかしオーバーレイ */
  .blur-overlay {
    position: absolute;
    inset: 0;
    background-color: rgba(30, 31, 32, 0.88);
    backdrop-filter: blur(7px);
    -webkit-backdrop-filter: blur(7px);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
    border-radius: 13px;
    cursor: pointer;
    z-index: 5;
  }

  .blur-overlay-label {
    font-size: 13px;
    font-weight: 600;
    color: var(--accent);
    padding: 6px 14px;
    border-radius: 999px;
    background-color: var(--accent-dim);
    border: 1px solid rgba(168, 199, 250, 0.3);
  }

  .blur-overlay-sub {
    font-size: 11px;
    color: var(--text-sub);
  }

  /* 4択リスト */
  .options-list {
    margin-top: 20px;
    display: flex;
    flex-direction: column;
    gap: 5px;
    flex-shrink: 0;
  }

  .option-btn {
    width: 100%;
    min-height: 48px;
    padding: 9px 14px;
    flex-shrink: 0;
    border-radius: 12px;
    background-color: var(--bg-card);
    border: 1px solid var(--border-subtle);
    color: var(--text-main);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    cursor: pointer;
    text-align: left;
    transition: background-color 0.15s ease, border-color 0.15s ease;
  }

  .option-btn:active:not(.locked) {
    background-color: var(--bg-card-alt);
  }

  .option-left {
    display: flex;
    align-items: center;
    gap: 12px;
    min-width: 0;
  }

  .option-right {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-shrink: 0;
  }

  .option-phonetic {
    font-size: 12px;
    color: var(--text-sub);
    font-weight: 400;
    letter-spacing: 0.01em;
  }

  .option-letter {
    width: 24px;
    height: 24px;
    border-radius: 6px;
    background-color: var(--bg-card-alt);
    color: var(--text-sub);
    font-size: 12px;
    font-weight: 700;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .option-word {
    font-size: 15.5px;
    font-weight: 500;
    color: var(--text-main);
  }

  .option-btn.correct {
    background-color: var(--correct-bg);
    border-color: var(--correct-border);
  }

  .option-btn.correct .option-letter {
    background-color: var(--correct-border);
    color: #131314;
  }

  .option-btn.correct .option-word {
    color: var(--correct-text);
    font-weight: 600;
  }

  .option-btn.wrong {
    background-color: var(--wrong-bg);
    border-color: var(--wrong-border);
  }

  .option-btn.wrong .option-letter {
    background-color: var(--wrong-border);
    color: #131314;
  }

  .option-btn.wrong .option-word {
    color: var(--wrong-text);
  }

  .opt-speaker-btn {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    border: 1px solid var(--border-subtle);
    background-color: var(--bg-card-alt);
    color: var(--text-sub);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
  }

  .opt-speaker-btn.speaking {
    border-color: var(--accent);
    color: var(--accent);
    background-color: var(--accent-dim);
  }

  /* 下部ボタン */
  .bottom-action {
    margin-top: 20px;
    flex-shrink: 0;
  }

  .next-btn {
    width: 100%;
    height: 46px;
    border-radius: 23px;
    border: 1px solid var(--border-subtle);
    background-color: var(--bg-card);
    color: var(--text-sub);
    font-size: 14.5px;
    font-weight: 600;
    cursor: not-allowed;
    transition: background-color 0.15s ease, color 0.15s ease, border-color 0.15s ease;
  }

  .next-btn.ready {
    background-color: var(--accent);
    border-color: var(--accent);
    color: #131314;
    cursor: pointer;
  }

  /* 結果画面＆1週間レポート画面 */
  .screen-hidden {
    display: none !important;
  }

  .result-container {
    margin-top: 22px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    padding-bottom: 12px;
  }

  .score-card {
    background-color: var(--bg-card);
    border: 1px solid var(--border-subtle);
    border-radius: 16px;
    padding: 18px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
  }

  .score-main-label {
    font-size: 12px;
    color: var(--text-sub);
    margin-bottom: 4px;
  }

  .score-value {
    font-size: 30px;
    font-weight: 700;
    color: var(--accent);
    font-variant-numeric: tabular-nums;
  }

  .score-value span {
    font-size: 15px;
    color: var(--text-sub);
    font-weight: 500;
  }

  .score-total-badge {
    text-align: right;
    font-size: 12px;
    color: var(--text-sub);
    line-height: 1.5;
  }

  .score-total-badge strong {
    color: var(--text-main);
    font-size: 14px;
  }

  .action-group {
    display: flex;
    flex-direction: column;
    gap: 8px;
    flex-shrink: 0;
  }

  .primary-action-btn {
    width: 100%;
    height: 46px;
    border-radius: 12px;
    border: none;
    background-color: var(--accent);
    color: #131314;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
  }

  .secondary-action-btn {
    width: 100%;
    height: 44px;
    border-radius: 12px;
    border: 1px solid var(--border-subtle);
    background-color: var(--bg-card);
    color: var(--text-main);
    font-size: 13.5px;
    font-weight: 600;
    cursor: pointer;
  }

  .secondary-action-btn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }

  .review-list-card {
    background-color: var(--bg-card);
    border: 1px solid var(--border-subtle);
    border-radius: 14px;
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    flex-shrink: 0;
  }

  .section-sub-title {
    font-size: 12px;
    font-weight: 700;
    color: var(--text-sub);
    letter-spacing: 0.03em;
  }

  .summary-item {
    padding: 9px 10px;
    border-radius: 10px;
    background-color: var(--bg-card-alt);
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .summary-item-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }

  .summary-word-wrap {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .status-dot {
    font-size: 11px;
    font-weight: 700;
    padding: 2px 7px;
    border-radius: 6px;
  }

  .status-dot.ok {
    background-color: var(--correct-bg);
    color: var(--correct-text);
  }

  .status-dot.ng {
    background-color: var(--wrong-bg);
    color: var(--wrong-text);
  }

  .summary-word {
    font-size: 14px;
    font-weight: 600;
    color: var(--text-main);
  }

  .summary-ja {
    font-size: 12px;
    color: var(--text-sub);
    line-height: 1.45;
  }

  /* 1週間レポートグラフ */
  .chart-bars {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 6px;
    align-items: end;
    height: 110px;
    padding-top: 14px;
  }

  .chart-col {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 5px;
    height: 100%;
    justify-content: flex-end;
  }

  .chart-pct {
    font-size: 10px;
    color: var(--text-sub);
    font-variant-numeric: tabular-nums;
  }

  .chart-bar-track {
    width: 100%;
    max-width: 24px;
    height: 64px;
    background-color: var(--bg-card-alt);
    border-radius: 6px;
    display: flex;
    align-items: flex-end;
    overflow: hidden;
  }

  .chart-bar-fill {
    width: 100%;
    background-color: var(--accent);
    border-radius: 6px;
    transition: height 0.25s ease;
  }

  .chart-date {
    font-size: 10px;
    color: var(--text-sub);
  }

  .cat-row {
    display: flex;
    flex-direction: column;
    gap: 4px;
    margin-top: 6px;
  }

  .cat-row-top {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    color: var(--text-main);
  }

  .cat-track {
    width: 100%;
    height: 6px;
    background-color: var(--bg-card-alt);
    border-radius: 3px;
    overflow: hidden;
  }

  .cat-fill {
    height: 100%;
    background-color: var(--hint-vocab-pill-text);
    border-radius: 3px;
  }
</style>
</head>
<body>
<div class="app-shell">
  <!-- 共通トップヘッダー（62px余白直下・インスタグラムストーリー風5分割バー） -->
  <header class="top-header">
    <div class="header-row">
      <div class="header-title-wrap">
        <span class="header-title" id="headerTitle">TOEFL ITP 基礎単語</span>
        <span class="mode-badge screen-hidden" id="reviewBadge">復習モード</span>
      </div>
      <span class="header-count" id="headerCount">1 / 5</span>
    </div>
    <div class="progress-segments" id="progressSegments"></div>
  </header>

  <!-- クイズ画面（1画面完結・スクロール不要） -->
  <main id="quizView">
    <section class="question-section">
      <div class="question-text" id="questionText"></div>
      <button type="button" class="speaker-btn" id="questionSpeakerBtn" aria-label="英文を再生">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
          <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
          <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
        </svg>
      </button>
    </section>

    <section class="hint-card" id="hintCard">
      <div class="blur-overlay screen-hidden" id="blurOverlay">
        <span class="blur-overlay-label">タップしてヒントを表示</span>
        <span class="blur-overlay-sub">まずは自力で文脈から考えてみましょう</span>
      </div>
      <div id="hintCardContent"></div>
    </section>

    <section class="options-list" id="optionsList"></section>

    <div class="bottom-action">
      <button type="button" class="next-btn" id="nextBtn" disabled>選択肢を選んでください</button>
    </div>
  </main>

  <!-- 結果画面（5問ごとの区切り） -->
  <section id="resultView" class="result-container screen-hidden">
    <div class="score-card">
      <div>
        <div class="score-main-label" id="resultSubtitle">今回のスコア</div>
        <div class="score-value" id="scoreValue">0 <span>/ 5 問正解</span></div>
      </div>
      <div class="score-total-badge" id="cumulativeBadge"></div>
    </div>

    <div class="action-group">
      <button type="button" class="primary-action-btn" id="newSetBtn">新しい5問を解く</button>
      <button type="button" class="secondary-action-btn" id="retryWrongBtn">間違えた問題だけ解き直す</button>
      <button type="button" class="secondary-action-btn" id="openReportBtn">1週間レポートを見る</button>
    </div>

    <div class="review-list-card">
      <div class="section-sub-title">今回の出題一覧（タップで発音確認）</div>
      <div id="sessionSummaryList" style="display:flex;flex-direction:column;gap:6px;"></div>
    </div>

const STORAGE_KEY = "toefl_itp_500_history_v1";
const SEEN_KEY = "toefl_itp_500_seen_ids_v1";

let sessionQuestions = [];
let currentIndex = 0;
let userAnswers = [];
let isAnswered = false;
let showingHintAfterAnswer = false;
let isReviewMode = false;
let speakToken = 0;
let speakCleanupTimer = null;

function preloadVoices() {
  if (!("speechSynthesis" in window)) return;
  try {
    window.speechSynthesis.getVoices();
  } catch (error) {
    console.warn("音声一覧を取得できませんでした:", error);
  }
}
preloadVoices();
if ("speechSynthesis" in window) {
  if (typeof window.speechSynthesis.addEventListener === "function") {
    window.speechSynthesis.addEventListener("voiceschanged", preloadVoices);
  } else {
    window.speechSynthesis.onvoiceschanged = preloadVoices;
  }
}

function stopAllSpeech() {
  // 実行中の読み上げを無効化してから、ブラウザの音声キューを空にする
  speakToken++;
  if (speakCleanupTimer) {
    clearTimeout(speakCleanupTimer);
    speakCleanupTimer = null;
  }
  if ("speechSynthesis" in window) {
    try {
      const engine = window.speechSynthesis;
      // 再生待ち・再生中の場合だけ停止する。待機時のcancel()は一部スマホで
      // 直後の読み上げを妨げることがあるため、不要な呼び出しを避ける。
      if (engine.speaking || engine.pending) engine.cancel();
    } catch (error) {
      console.warn("音声を停止できませんでした:", error);
    }
  }
  document.querySelectorAll(".speaking").forEach(el => el.classList.remove("speaking"));
}

/* 長文を短いフレーズ配列へ分割 */
function splitIntoSpeakChunks(text) {
  const cleaned = String(text || "").replace(/\s+/g, " ").trim();
  if (!cleaned) return [];
  const rawParts = cleaned.split(/(?<=[,;:.!?])\s+|\s+(?=\b(?:to|in|on|for|during|before|until|and|with|from|that|which)\b)/i);
  const chunks = [];
  let buf = "";
  for (const part of rawParts) {
    if (!part) continue;
    if ((buf + " " + part).trim().length <= 52) {
      buf = (buf ? buf + " " : "") + part;
    } else {
      if (buf) chunks.push(buf.trim());
      buf = part.trim();
    }
  }
  if (buf) chunks.push(buf.trim());
  return chunks.length ? chunks : [cleaned];
}

/*
 * PC・Android・iPhone/iPadで共通のWeb Speech APIを使用する。
 * 以前の実装はAndroidや長い例文で外部Google TTS音声に切り替えていたが、
 * 外部音声URLの再生が端末の自動再生制限や通信環境に左右されていた。
 * クリック操作の中で全チャンクをspeechSynthesisへ登録し、端末標準の英語音声で再生する。
 */
function speakChunks(chunks, triggerEl) {
  const engine = window.speechSynthesis;
  if (!("speechSynthesis" in window) || typeof window.SpeechSynthesisUtterance !== "function") {
    alert("このブラウザは音声読み上げに対応していません。最新版のSafariまたはChromeでお試しください。");
    return;
  }

  const validChunks = (chunks || [])
    .map(chunk => String(chunk || "").replace(/\s+/g, " ").trim())
    .filter(Boolean);

  if (!validChunks.length) return;

  // 分割していたフレーズを1つの英文に戻し、1つの発話として読み上げる。
  // 複数のUtteranceを連続登録する方式より、スマホでのキュー停止を避けやすい。
  const textToSpeak = validChunks.join(" ");

  // 再生中の別音声だけを止める。待機時のcancel()は呼ばない。
  stopAllSpeech();
  const token = speakToken;

  if (triggerEl) triggerEl.classList.add("speaking");

  let voices = [];
  try {
    voices = engine.getVoices() || [];
  } catch (error) {
    console.warn("音声一覧を取得できませんでした:", error);
  }

  // en-USを優先。音声一覧がまだ取得できない場合もlang指定で再生する。
  const englishVoice =
    voices.find(voice => /^en[-_]US$/i.test(voice.lang)) ||
    voices.find(voice => /^en/i.test(voice.lang)) ||
    null;

  let finished = false;
  const finish = () => {
    if (finished || token !== speakToken) return;
    finished = true;
    if (speakCleanupTimer) {
      clearTimeout(speakCleanupTimer);
      speakCleanupTimer = null;
    }
    if (triggerEl) triggerEl.classList.remove("speaking");
  };

  // onendが返らないブラウザでも、再生中表示が残り続けないようにする
  speakCleanupTimer = setTimeout(
    finish,
    Math.max(30000, textToSpeak.length * 320 + 10000)
  );

  const utterance = new SpeechSynthesisUtterance(textToSpeak);
  utterance.lang = "en-US";
  utterance.rate = 0.92;
  utterance.pitch = 1;
  utterance.volume = 1;
  if (englishVoice) utterance.voice = englishVoice;
  utterance.onend = finish;
  utterance.onerror = event => {
    if (event && event.error && !["canceled", "interrupted"].includes(event.error)) {
      console.warn("音声読み上げエラー:", event.error);
    }
    finish();
  };

  try {
    // ボタンのクリックイベント内で直接発話を開始する。
    // iOS Safariなどで一時停止状態が残っている場合だけresumeを試す。
    try {
      if (engine.paused) engine.resume();
    } catch (error) {
      // resume非対応時もspeak()を続行する
    }
    engine.speak(utterance);
  } catch (error) {
    console.error("音声を再生できませんでした:", error);
    finish();
    alert("音声を再生できませんでした。端末の音量とブラウザの音声設定をご確認ください。");
  }
}

function speakCurrentQuestion() {
  const q = sessionQuestions[currentIndex];
  const btn = document.getElementById("questionSpeakerBtn");
  if (!isAnswered) {
    const chunks = [
      ...splitIntoSpeakChunks(q.before),
      "blank",
      ...splitIntoSpeakChunks(q.after)
    ];
    speakChunks(chunks, btn);
  } else {
    const fullSentence = `${q.before} ${q.answer} ${q.after}`;
    speakChunks(splitIntoSpeakChunks(fullSentence), btn);
  }
}

/* 5問ずつ出題選定 */
function pickFiveQuestions() {
  let seen = [];
  try {
    seen = JSON.parse(localStorage.getItem(SEEN_KEY) || "[]");
  } catch (e) { seen = []; }

  let pool = QUESTION_BANK.filter(q => !seen.includes(q.id));
  if (pool.length < 5) {
    seen = [];
    pool = [...QUESTION_BANK];
  }

  for (let i = pool.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [pool[i], pool[j]] = [pool[j], pool[i]];
  }

  const picked = pool.slice(0, 5);
  const newSeen = [...seen, ...picked.map(q => q.id)];
  try {
    localStorage.setItem(SEEN_KEY, JSON.stringify(newSeen));
  } catch (e) {}

  return picked.map(q => {
    const shuffledChoices = [...q.choices];
    for (let i = shuffledChoices.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [shuffledChoices[i], shuffledChoices[j]] = [shuffledChoices[j], shuffledChoices[i]];
    }
    return { ...q, shuffledChoices };
  });
}

function startSession(questions, reviewMode = false) {
  stopAllSpeech();
  sessionQuestions = questions;
  currentIndex = 0;
  userAnswers = new Array(questions.length).fill(null);
  isReviewMode = reviewMode;

  document.getElementById("quizView").classList.remove("screen-hidden");
  document.getElementById("resultView").classList.add("screen-hidden");
  document.getElementById("reportView").classList.add("screen-hidden");
  document.getElementById("headerTitle").textContent = "TOEFL ITP 基礎単語";

  const badge = document.getElementById("reviewBadge");
  if (isReviewMode) {
    badge.classList.remove("screen-hidden");
  } else {
    badge.classList.add("screen-hidden");
  }

  renderQuestion();
}

function renderProgress() {
  const total = sessionQuestions.length;
  document.getElementById("headerCount").textContent = `${currentIndex + 1} / ${total}`;
  const container = document.getElementById("progressSegments");
  container.style.gridTemplateColumns = `repeat(${total}, 1fr)`;
  container.innerHTML = "";

  for (let i = 0; i < total; i++) {
    const seg = document.createElement("div");
    seg.className = "progress-seg";
    if (i < currentIndex) {
      const ans = userAnswers[i];
      if (ans && !ans.isCorrect) {
        seg.classList.add("wrong");
      } else {
        seg.classList.add("active");
      }
    } else if (i === currentIndex) {
      if (isAnswered && userAnswers[i] && !userAnswers[i].isCorrect) {
        seg.classList.add("wrong");
      } else {
        seg.classList.add("active");
      }
    }
    container.appendChild(seg);
  }
}

function renderHintOrExplanation() {
  const q = sessionQuestions[currentIndex];
  const card = document.getElementById("hintCard");
  const content = document.getElementById("hintCardContent");
  card.scrollTop = 0;

  if (!isAnswered || showingHintAfterAnswer) {
    const toggleHtml = isAnswered
      ? `<span class="toggle-indicator">⇄ タップで解説に戻る</span>`
      : "";

    const vocabChips = q.vocab
      .map(v => `<span class="word-chip"><strong>${v.w}</strong><span>${v.m}</span></span>`)
      .join("");

    content.innerHTML = `
      <div class="hint-stack">
        <div class="hint-box struct">
          <div class="hint-box-header">
            <span class="hint-pill">骨組み</span>
            ${toggleHtml}
          </div>
          <div class="hint-body-text">${q.structure}</div>
        </div>
        <div class="hint-box vocab">
          <div class="hint-box-header">
            <span class="hint-pill">単語</span>
          </div>
          <div class="chip-list">${vocabChips}</div>
        </div>
        <div class="hint-box gram">
          <div class="hint-box-header">
            <span class="hint-pill">文法</span>          </div>
          <div class="hint-body-text">${q.grammar}</div>
        </div>
      </div>
    `;
  } else {
    const letters = ["A", "B", "C", "D"];
    const choiceRows = q.shuffledChoices.map((w, idx) => {
      const isCorr = w === q.answer;
      return `
        <div class="exp-choice-item ${isCorr ? "is-correct" : ""}">
          <span class="exp-choice-word">${letters[idx]}. ${w}</span>
          <span class="exp-choice-meaning">${q.choiceMeanings[w] || ""}</span>
        </div>
      `;
    }).join("");

    content.innerHTML = `
      <div>
        <div class="exp-header">
          <span class="exp-badge">全訳・語彙解説</span>
          <span class="toggle-indicator">⇄ タップでヒント</span>
        </div>
        <div class="exp-translation">${q.translation}</div>
        <div class="exp-choices-grid">${choiceRows}</div>
      </div>
    `;
  }
}

function renderQuestion() {
  isAnswered = false;
  showingHintAfterAnswer = false;
  const q = sessionQuestions[currentIndex];

  renderProgress();

  const qEl = document.getElementById("questionText");
  qEl.innerHTML = `${q.before} <span class="blank-slot" id="blankSlot">______</span> ${q.after}`;

  const card = document.getElementById("hintCard");
  card.classList.remove("interactive");

  const blurOverlay = document.getElementById("blurOverlay");
  if (isReviewMode) {
    blurOverlay.classList.remove("screen-hidden");
  } else {
    blurOverlay.classList.add("screen-hidden");
  }

  renderHintOrExplanation();

  const optionsList = document.getElementById("optionsList");
  optionsList.innerHTML = "";
  const letters = ["A", "B", "C", "D"];

  q.shuffledChoices.forEach((word, idx) => {
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "option-btn";
    btn.dataset.word = word;
    const phonetic = WORD_PHONETICS[word] || "";

    btn.innerHTML = `
      <span class="option-left">
        <span class="option-letter">${letters[idx]}</span>
        <span class="option-word">${word}</span>
      </span>
      <span class="option-right">
        <span class="option-phonetic">${phonetic}</span>
        <span class="opt-speaker-btn" role="button" aria-label="${word}を発音">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
            <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
          </svg>
        </span>
      </span>
    `;

    const spk = btn.querySelector(".opt-speaker-btn");
    spk.addEventListener("click", (e) => {
      e.stopPropagation();
      speakChunks([word], spk);
    });

    btn.addEventListener("click", () => handleSelectOption(word));
    optionsList.appendChild(btn);
  });

  const nextBtn = document.getElementById("nextBtn");
  nextBtn.disabled = true;
  nextBtn.classList.remove("ready");
  nextBtn.textContent = "選択肢を選んでください";
}

function handleSelectOption(selectedWord) {
  if (isAnswered) return;
  isAnswered = true;
  showingHintAfterAnswer = false;

  const q = sessionQuestions[currentIndex];
  const isCorrect = selectedWord === q.answer;
  userAnswers[currentIndex] = { question: q, selected: selectedWord, isCorrect };

  const blankSlot = document.getElementById("blankSlot");
  blankSlot.textContent = q.answer;
  blankSlot.classList.add("filled");

  document.getElementById("blurOverlay").classList.add("screen-hidden");
  const card = document.getElementById("hintCard");
  card.classList.add("interactive");
  renderHintOrExplanation();

  document.querySelectorAll(".option-btn").forEach(btn => {
    btn.classList.add("locked");
    const w = btn.dataset.word;
    if (w === q.answer) {
      btn.classList.add("correct");
    } else if (w === selectedWord && !isCorrect) {
      btn.classList.add("wrong");
    }
  });

  renderProgress();

  const nextBtn = document.getElementById("nextBtn");
  nextBtn.disabled = false;
  nextBtn.classList.add("ready");
  nextBtn.textContent = (currentIndex === sessionQuestions.length - 1) ? "結果を見る" : "次の問題へ";
}

/* 学習記録の永続保存 */
function saveSessionHistory() {
  let history = {
    totalAnswered: 0,
    totalCorrect: 0,
    daily: {},
    categories: {},
    missedWords: []
  };
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) history = { ...history, ...JSON.parse(raw) };
  } catch (e) {}

  const now = new Date();
  const dateKey = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, "0")}-${String(now.getDate()).padStart(2, "0")}`;

  if (!history.daily[dateKey]) {
    history.daily[dateKey] = { answered: 0, correct: 0 };
  }

  userAnswers.forEach(item => {
    if (!item) return;
    history.totalAnswered += 1;
    history.daily[dateKey].answered += 1;
    if (item.isCorrect) {
      history.totalCorrect += 1;
      history.daily[dateKey].correct += 1;
    }

    const cat = item.question.category || "その他";
    if (!history.categories[cat]) {
      history.categories[cat] = { answered: 0, correct: 0 };
    }
    history.categories[cat].answered += 1;
    if (item.isCorrect) history.categories[cat].correct += 1;

    if (!item.isCorrect) {
      history.missedWords = history.missedWords.filter(m => m.answer !== item.question.answer);
      history.missedWords.unshift({
        answer: item.question.answer,
        meaning: item.question.choiceMeanings[item.question.answer] || "",
        translation: item.question.translation
      });
      if (history.missedWords.length > 30) {
        history.missedWords = history.missedWords.slice(0, 30);
      }
    }
  });

  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(history));
  } catch (e) {}

  return history;
}

function showResults() {
  stopAllSpeech();
  const history = saveSessionHistory();

  document.getElementById("quizView").classList.add("screen-hidden");
  document.getElementById("reportView").classList.add("screen-hidden");
  document.getElementById("resultView").classList.remove("screen-hidden");
  document.getElementById("headerTitle").textContent = "演習結果";
  document.getElementById("headerCount").textContent = "5問完了";

  const correctCount = userAnswers.filter(a => a && a.isCorrect).length;
  const totalCount = sessionQuestions.length;

  document.getElementById("resultSubtitle").textContent = isReviewMode ? "復習セットのスコア" : "今回のスコア（5問セット）";
  document.getElementById("scoreValue").innerHTML = `${correctCount} <span>/ ${totalCount} 問正解</span>`;
  document.getElementById("cumulativeBadge").innerHTML = `累計演習: <strong>${history.totalAnswered}問</strong><br>累計正答率: <strong>${history.totalAnswered ? Math.round((history.totalCorrect / history.totalAnswered) * 100) : 0}%</strong>`;

  const wrongItems = userAnswers.filter(a => a && !a.isCorrect).map(a => a.question);
  const retryBtn = document.getElementById("retryWrongBtn");
  if (wrongItems.length === 0) {
    retryBtn.disabled = true;
    retryBtn.textContent = "間違えた問題はありません（全問正解）";
  } else {
    retryBtn.disabled = false;
    retryBtn.textContent = `間違えた問題だけ解き直す（${wrongItems.length}問・ヒントぼかし）`;
    retryBtn.onclick = () => {
      const rePacked = wrongItems.map(q => {
        const sc = [...q.choices].sort(() => Math.random() - 0.5);
        return { ...q, shuffledChoices: sc };
      });
      startSession(rePacked, true);
    };
  }

  const listEl = document.getElementById("sessionSummaryList");
  listEl.innerHTML = "";
  userAnswers.forEach(item => {
    if (!item) return;
    const q = item.question;
    const row = document.createElement("div");
    row.className = "summary-item";
    row.innerHTML = `
      <div class="summary-item-top">
        <div class="summary-word-wrap">
          <span class="status-dot ${item.isCorrect ? "ok" : "ng"}">${item.isCorrect ? "正解" : "要復習"}</span>
          <span class="summary-word">${q.answer}</span>
          <span style="font-size:12px;color:var(--text-sub);">${q.choiceMeanings[q.answer] || ""}</span>
        </div>
        <button type="button" class="opt-speaker-btn" aria-label="${q.answer}を発音">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
            <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
          </svg>
        </button>
      </div>
      <div class="summary-ja">${q.translation}</div>
    `;
    const btn = row.querySelector(".opt-speaker-btn");
    btn.addEventListener("click", () => speakChunks([q.answer], btn));
    listEl.appendChild(row);
  });
}

function showWeeklyReport() {
  stopAllSpeech();
  let history = { totalAnswered: 0, totalCorrect: 0, daily: {}, categories: {}, missedWords: [] };
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) history = { ...history, ...JSON.parse(raw) };
  } catch (e) {}

  document.getElementById("quizView").classList.add("screen-hidden");
  document.getElementById("resultView").classList.add("screen-hidden");
  document.getElementById("reportView").classList.remove("screen-hidden");
  document.getElementById("headerTitle").textContent = "1週間レポート";
  document.getElementById("headerCount").textContent = "記録保持中";

  document.getElementById("reportTotalCount").innerHTML = `${history.totalAnswered} <span>問演習</span>`;
  const overallPct = history.totalAnswered ? Math.round((history.totalCorrect / history.totalAnswered) * 100) : 0;
  document.getElementById("reportOverallAcc").innerHTML = `累計正解: <strong>${history.totalCorrect}問</strong><br>平均正答率: <strong>${overallPct}%</strong>`;

  const chartEl = document.getElementById("weeklyChartBars");
  chartEl.innerHTML = "";
  const today = new Date();
  for (let d = 6; d >= 0; d--) {
    const dt = new Date(today);
    dt.setDate(today.getDate() - d);
    const key = `${dt.getFullYear()}-${String(dt.getMonth() + 1).padStart(2, "0")}-${String(dt.getDate()).padStart(2, "0")}`;
    const rec = history.daily[key] || { answered: 0, correct: 0 };
    const pct = rec.answered ? Math.round((rec.correct / rec.answered) * 100) : 0;

    const col = document.createElement("div");
    col.className = "chart-col";
    col.innerHTML = `
      <span class="chart-pct">${rec.answered ? pct + "%" : "-"}</span>
      <div class="chart-bar-track">
        <div class="chart-bar-fill" style="height:${rec.answered ? Math.max(pct, 8) : 0}%"></div>
      </div>
      <span class="chart-date">${dt.getMonth() + 1}/${dt.getDate()}</span>
    `;
    chartEl.appendChild(col);
  }

  const catEl = document.getElementById("categoryBreakdown");
  catEl.innerHTML = "";
  const cats = Object.keys(history.categories);
  if (!cats.length) {
    catEl.innerHTML = `<div class="summary-ja">まだデータがありません。</div>`;
  } else {
    cats.forEach(c => {
      const item = history.categories[c];
      const p = item.answered ? Math.round((item.correct / item.answered) * 100) : 0;
      const row = document.createElement("div");
      row.className = "cat-row";
      row.innerHTML = `
        <div class="cat-row-top">
          <span>${c}</span>
          <span>${p}% (${item.correct}/${item.answered})</span>
        </div>
        <div class="cat-track">
          <div class="cat-fill" style="width:${p}%"></div>
        </div>
      `;
      catEl.appendChild(row);
    });
  }

  const missedEl = document.getElementById("missedWordsHistory");
  missedEl.innerHTML = "";
  if (!history.missedWords.length) {
    missedEl.innerHTML = `<div class="summary-ja">現在、未定着の単語はありません。</div>`;
  } else {
    history.missedWords.slice(0, 10).forEach(m => {
      const row = document.createElement("div");
      row.className = "summary-item";
      row.innerHTML = `
        <div class="summary-item-top">
          <div class="summary-word-wrap">
            <span class="summary-word">${m.answer}</span>
            <span style="font-size:12px;color:var(--text-sub);">${m.meaning}</span>
          </div>
          <button type="button" class="opt-speaker-btn" aria-label="${m.answer}を発音">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
              <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
            </svg>
          </button>
        </div>
      `;
      const btn = row.querySelector(".opt-speaker-btn");
      btn.addEventListener("click", () => speakChunks([m.answer], btn));
      missedEl.appendChild(row);
    });
  }
}

document.getElementById("questionSpeakerBtn").addEventListener("click", speakCurrentQuestion);

document.getElementById("blurOverlay").addEventListener("click", (e) => {
  e.stopPropagation();
  document.getElementById("blurOverlay").classList.add("screen-hidden");
});

document.getElementById("hintCard").addEventListener("click", () => {
  if (!isAnswered) return;
  showingHintAfterAnswer = !showingHintAfterAnswer;
  renderHintOrExplanation();
});

document.getElementById("nextBtn").addEventListener("click", () => {
  if (!isAnswered) return;
  stopAllSpeech();
  if (currentIndex < sessionQuestions.length - 1) {
    currentIndex++;
    renderQuestion();
  } else {
    showResults();
  }
});

document.getElementById("newSetBtn").addEventListener("click", () => {
  startSession(pickFiveQuestions(), false);
});

document.getElementById("openReportBtn").addEventListener("click", showWeeklyReport);

document.getElementById("backToResultBtn").addEventListener("click", () => {
  document.getElementById("reportView").classList.add("screen-hidden");
  document.getElementById("resultView").classList.remove("screen-hidden");
  document.getElementById("headerTitle").textContent = "演習結果";
  document.getElementById("headerCount").textContent = "5問完了";
});

document.getElementById("reportNewSetBtn").addEventListener("click", () => {
  startSession(pickFiveQuestions(), false);
});

startSession(pickFiveQuestions(), false);
</script>
